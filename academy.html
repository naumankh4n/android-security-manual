<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DroidSec Lab — Learn Android Security by Breaking It</title>
<style>
/* ============================= THEME ============================= */
:root{
  --bg:#080b11; --bg2:#0d121b; --panel:#111825; --panel2:#151d2c;
  --line:#1e2a3c; --line2:#2b3b52;
  --txt:#e7eef7; --dim:#8fa2ba; --dim2:#63758c;
  --acc:#3ddc97; --acc2:#4ea8ff; --acc3:#b06bff; --warn:#ffb454; --bad:#ff6b6b;
  --r:14px; --r2:10px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --shadow:0 10px 40px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 700px at 80% -10%, rgba(78,168,255,.10), transparent 60%),
    radial-gradient(900px 600px at 5% 10%, rgba(61,220,151,.08), transparent 60%),
    var(--bg);
  color:var(--txt); font-family:var(--sans); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
h1,h2,h3,h4{margin:0 0 .4em; line-height:1.2; font-weight:700; letter-spacing:-.02em}
h1{font-size:clamp(28px,5vw,52px)}
h2{font-size:clamp(20px,3vw,30px)}
h3{font-size:18px}
p{margin:0 0 .8em}
a{color:var(--acc2)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--acc2); outline-offset:2px; border-radius:6px}
.skip{position:absolute;left:-9999px;top:0;background:var(--acc2);color:#04121f;padding:10px 16px;z-index:99;border-radius:0 0 8px 0}
.skip:focus{left:0}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#22304a;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ============================= LAYOUT ============================= */
.topbar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;
  padding:10px 18px;background:rgba(8,11,17,.82);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 14px var(--acc)}
.brand span.sub{font-weight:500;color:var(--dim);font-size:12px;letter-spacing:.06em}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav button{
  background:transparent;border:1px solid transparent;color:var(--dim);padding:8px 12px;
  border-radius:9px;cursor:pointer;font-size:13.5px;font-weight:600;transition:.18s;
}
.nav button:hover{color:var(--txt);background:#141c2a}
.nav button.on{color:var(--txt);background:#172234;border-color:var(--line2)}
.xpwrap{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--dim);white-space:nowrap}
.xpbar{width:110px;height:7px;border-radius:6px;background:#1a2436;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0;transition:width .5s}
.lvlchip{background:#16233a;border:1px solid var(--line2);padding:3px 9px;border-radius:20px;font-weight:700;color:var(--txt);font-size:11.5px}
main{max-width:1240px;margin:0 auto;padding:26px 18px 120px}
.view{display:none;animation:fade .35s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.mobilenav{display:none}
@media(max-width:760px){
  .nav{display:none}
  .mobilenav{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:rgba(10,14,21,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .mobilenav button{
    flex:1;background:transparent;border:0;color:var(--dim);font-size:10.5px;font-weight:600;
    display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:10px;cursor:pointer
  }
  .mobilenav button b{font-size:17px;font-weight:400;line-height:1}
  .mobilenav button.on{color:var(--acc);background:#131c2b}
  main{padding-bottom:110px}
}

/* ============================= COMPONENTS ============================= */
.card{
  background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:16px;
}
.card.tight{padding:14px 16px}
.card.tech{border-left:3px solid var(--acc2)}
.card.warn{border-left:3px solid var(--warn)}
.card.bad{border-left:3px solid var(--bad)}
.card.good{border-left:3px solid var(--acc)}
.kicker{
  font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acc2);margin-bottom:8px;display:flex;align-items:center;gap:7px
}
.kicker.g{color:var(--acc)} .kicker.w{color:var(--warn)} .kicker.r{color:var(--bad)} .kicker.p{color:var(--acc3)}
.muted{color:var(--dim)}
.tiny{font-size:12.5px}
.big{font-size:16.5px;line-height:1.65}
.btn{
  background:#1a2637;border:1px solid var(--line2);color:var(--txt);padding:10px 16px;
  border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;transition:.16s;
  display:inline-flex;align-items:center;gap:8px
}
.btn:hover{background:#22324a;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.primary{background:linear-gradient(135deg,var(--acc),#2bb87c);color:#04150e;border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.blue{background:linear-gradient(135deg,var(--acc2),#2f7fd6);color:#04121f;border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;border:1px solid var(--line2);color:var(--dim)}
.pill.g{color:var(--acc);border-color:#1e5c44;background:#0c1f19}
.pill.b{color:var(--acc2);border-color:#1d4265;background:#0b1a2a}
.pill.w{color:var(--warn);border-color:#5c431e;background:#1f1808}
.pill.r{color:var(--bad);border-color:#5c2424;background:#1f0c0c}
.pill.p{color:var(--acc3);border-color:#43265c;background:#180c1f}
code.inline{font-family:var(--mono);background:#0d1622;border:1px solid var(--line);padding:1px 6px;border-radius:5px;font-size:13px;color:#a8d8ff}
mark{background:#3a2d00;color:#ffd479;padding:0 3px;border-radius:3px}
hr.sep{border:0;border-top:1px solid var(--line);margin:18px 0}

/* code blocks */
pre.code{
  font-family:var(--mono);font-size:13px;line-height:1.6;background:#080d15;border:1px solid var(--line);
  border-radius:var(--r2);padding:14px 16px;overflow:auto;margin:0 0 12px;color:#cfe3f7
}
.tk-k{color:#ff9ecb} .tk-s{color:#8be9a8} .tk-c{color:#5a6b80;font-style:italic}
pre.code.vuln{border-left:3px solid var(--bad)}
pre.code.fix{border-left:3px solid var(--acc)}

/* terminal */
.term{background:#05090f;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;font-family:var(--mono)}
.term .bar{display:flex;gap:6px;padding:9px 12px;background:#0b1119;border-bottom:1px solid var(--line);align-items:center}
.term .bar i{width:11px;height:11px;border-radius:50%;display:block}
.term .bar i:nth-child(1){background:#ff5f57}.term .bar i:nth-child(2){background:#febc2e}.term .bar i:nth-child(3){background:#28c840}
.term .bar span{margin-left:8px;font-size:12px;color:var(--dim)}
.term .out{padding:14px;height:380px;overflow:auto;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.term .out .cmd{color:#7fd1ff}
.term .out .ok{color:var(--acc)}
.term .out .er{color:var(--bad)}
.term .out .wr{color:var(--warn)}
.term .out .dm{color:var(--dim)}
.term form{display:flex;border-top:1px solid var(--line);background:#0b1119}
.term form span{padding:12px 4px 12px 14px;color:var(--acc);font-family:var(--mono)}
.term input{
  flex:1;background:transparent;border:0;color:var(--txt);font-family:var(--mono);font-size:13px;
  padding:12px 14px 12px 6px;outline:none
}

/* lessons */
.stepper{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.stepper::-webkit-scrollbar{display:none}
.stepper button{
  flex:0 0 auto;background:#111a28;border:1px solid var(--line);color:var(--dim2);border-radius:20px;
  padding:6px 13px;font-size:12px;font-weight:700;cursor:pointer;transition:.18s;white-space:nowrap
}
.stepper button.on{background:#17304a;color:#cfe9ff;border-color:#2b5b8a}
.stepper button.done{color:var(--acc);border-color:#1e5c44;background:#0c1f19}
.stepper button:disabled{opacity:.45;cursor:not-allowed}
.lesshead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:14px}

/* viz stage */
.stage{
  background:radial-gradient(700px 300px at 50% 0%,rgba(78,168,255,.09),transparent 70%),#0a0f18;
  border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative;overflow:hidden
}
.phone{
  width:min(320px,86vw);margin:0 auto;background:#0c121c;border:2px solid #26364d;border-radius:30px;
  padding:12px;box-shadow:var(--shadow);position:relative
}
.phone .scr{background:#050810;border-radius:20px;min-height:300px;padding:14px;position:relative;overflow:hidden;border:1px solid #16202f}
.phone .notch{width:70px;height:5px;background:#26364d;border-radius:5px;margin:0 auto 10px}
.screenrow{display:flex;gap:8px;align-items:center;padding:9px 11px;border-radius:9px;background:#0e1522;border:1px solid #1b2536;margin-bottom:7px;font-size:13px}
.screenrow.sel{border-color:var(--acc2);background:#0f2033}
.screenrow.hit{border-color:var(--bad);background:#2a0f12}
.overlaybox{
  position:absolute;inset:0;background:rgba(255,107,107,.10);border:2px dashed var(--bad);
  display:flex;align-items:center;justify-content:center;color:var(--bad);font-weight:800;font-size:13px;
  border-radius:20px;pointer-events:none;opacity:0;transition:.3s
}
.overlaybox.on{opacity:1}
.pipe{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:10px 0}
.node{
  background:#111a28;border:1px solid var(--line2);border-radius:10px;padding:9px 13px;font-size:12.5px;
  font-weight:700;color:var(--dim);transition:.3s;text-align:center
}
.node.act{background:#132b42;border-color:var(--acc2);color:#cfe9ff;box-shadow:0 0 18px rgba(78,168,255,.35)}
.node.bad{background:#2a1013;border-color:var(--bad);color:#ffc9c9;box-shadow:0 0 18px rgba(255,107,107,.3)}
.node.good{background:#0d2419;border-color:var(--acc);color:#b9f5d6}
.arrow{color:var(--dim2);font-size:16px}
.chip{
  background:#141d2b;border:1px solid var(--line2);color:var(--dim);border-radius:20px;
  padding:6px 13px;font-size:12.5px;cursor:pointer;font-family:var(--mono);transition:.16s
}
.chip:hover{border-color:var(--acc2);color:#cfe9ff}
.chip.on{background:#17304a;border-color:var(--acc2);color:#d7ecff}
.chip.bad{border-color:var(--bad);color:#ffc9c9}
.chip.good{border-color:var(--acc);color:#b9f5d6}

/* stack viz */
.stack{display:flex;flex-direction:column-reverse;gap:6px;max-width:280px;margin:0 auto}
.stackcard{
  border:1px solid var(--line2);border-radius:10px;padding:11px 14px;background:#111a28;font-size:13px;
  font-weight:600;transition:.4s;position:relative
}
.stackcard.evil{border-color:var(--bad);background:#261013;color:#ffc9c9}
.stackcard.top{border-color:var(--acc2);box-shadow:0 0 0 2px rgba(78,168,255,.2)}

/* file tree */
.tree{font-family:var(--mono);font-size:13px;background:#080d15;border:1px solid var(--line);border-radius:var(--r2);padding:14px;line-height:1.9}
.tree .f{color:#9fb6cf}.tree .d{color:var(--acc2);font-weight:600}.tree .bad{color:var(--bad)}

/* quiz */
.qopt{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:#111a28;
  border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:12px 14px;cursor:pointer;
  font-size:14px;transition:.16s;margin-bottom:8px;font-family:inherit
}
.qopt:hover:not(:disabled){border-color:var(--acc2);background:#152134}
.qopt .k{
  flex:0 0 22px;height:22px;border-radius:6px;background:#1d2b3f;display:grid;place-items:center;
  font-size:11.5px;font-weight:800;color:var(--dim);margin-top:1px
}
.qopt.right{border-color:var(--acc);background:#0d2419}
.qopt.right .k{background:var(--acc);color:#04150e}
.qopt.wrong{border-color:var(--bad);background:#25100f}
.qopt.wrong .k{background:var(--bad);color:#1a0505}
.qopt:disabled{cursor:default}
.feedback{border-radius:11px;padding:12px 14px;font-size:13.5px;margin-top:6px;border:1px solid}
.feedback.ok{border-color:#1e5c44;background:#0c1f19;color:#b9f5d6}
.feedback.no{border-color:#5c2424;background:#1f0c0c;color:#ffc9c9}

/* map */
.branch{margin-bottom:22px}
.branchhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.branchhead .bdot{width:11px;height:11px;border-radius:50%}
.branchhead h3{margin:0;font-size:15.5px}
.branchhead .bcount{font-size:11.5px;color:var(--dim2);font-family:var(--mono)}
.nodes{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 12px;scroll-snap-type:x proximity}
.tnode{
  flex:0 0 210px;scroll-snap-align:start;background:#101725;border:1px solid var(--line);border-radius:12px;
  padding:12px 13px;cursor:pointer;transition:.2s;position:relative;text-align:left
}
.tnode:hover{transform:translateY(-3px);border-color:var(--line2);background:#141d2d}
.tnode .tt{font-weight:700;font-size:13.5px;margin-bottom:5px;line-height:1.3}
.tnode .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--dim2)}
.tnode .st{position:absolute;top:10px;right:11px;font-size:14px}
.tnode.done{border-color:#1e5c44;background:#0b1a15}
.tnode.locked{opacity:.5;cursor:not-allowed}
.tnode.locked:hover{transform:none;border-color:var(--line);background:#101725}
.tnode .bar{height:4px;background:#1b2536;border-radius:4px;margin-top:9px;overflow:hidden}
.tnode .bar i{display:block;height:100%;width:0;background:var(--acc)}

/* progress */
.radar{width:100%;max-width:360px;margin:0 auto;display:block}
.statbig{font-size:30px;font-weight:800;letter-spacing:-.03em}
.statlab{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim2);font-weight:700}

/* treemap + graph */
.tm{position:relative;width:100%;height:520px;background:#0a0f18;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tmcell{
  position:absolute;border:1px solid rgba(0,0,0,.55);border-radius:6px;overflow:hidden;cursor:pointer;
  padding:7px 9px;font-size:11.5px;font-weight:700;color:#04121f;transition:.15s;line-height:1.25
}
.tmcell:hover{filter:brightness(1.18);z-index:5}
.tmcell small{display:block;font-weight:600;opacity:.75;font-size:10px}

/* buckets */
.bucket{
  border:1.5px dashed var(--line2);border-radius:var(--r2);padding:12px;min-height:120px;background:#0b1119;transition:.18s
}
.bucket.hot{border-color:var(--acc2);background:#0e1a29}
.bucket h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin-bottom:9px}
.chips{display:flex;flex-wrap:wrap;gap:7px}

/* progress bars */
.pbar{height:9px;background:#1a2436;border-radius:6px;overflow:hidden;margin:5px 0 12px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .6s}

/* toast */
#toast{
  position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);background:#16233a;border:1px solid var(--line2);
  color:var(--txt);padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:600;z-index:100;
  opacity:0;pointer-events:none;transition:.3s;box-shadow:var(--shadow);max-width:90vw;text-align:center
}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:34px;align-items:center;padding:34px 0 10px}
@media(max-width:900px){.hero{grid-template-columns:1fr;gap:22px;text-align:center}.hero .row{justify-content:center}}
.hero h1 span{background:linear-gradient(100deg,var(--acc),var(--acc2) 55%,var(--acc3));-webkit-background-clip:text;background-clip:text;color:transparent}
.heroart{position:relative;display:grid;place-items:center;min-height:360px}
.dash{stroke-dasharray:6 7;animation:dash 2.6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-52}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35;r:5}50%{opacity:1;r:8}}
.float{animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}
body.nomotion *,body.nomotion *::before,body.nomotion *::after{
  animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="topbar">
  <div class="brand"><span class="dot"></span>DroidSec<span class="sub">LAB</span></div>
  <nav class="nav" id="nav" aria-label="Main navigation">
    <button data-go="home" class="on">Home</button>
    <button data-go="map">Learning Map</button>
    <button data-go="lab">Lab</button>
    <button data-go="progress">Progress</button>
    <button data-go="boss">Final Boss</button>
  </nav>
  <div class="xpwrap">
    <span class="lvlchip" id="lvlchip">LVL 1</span>
    <div class="xpbar" aria-hidden="true"><i id="xpfill"></i></div>
    <span id="xptext">0 XP</span>
  </div>
</header>

<main id="main">
  <section id="view-home" class="view on" aria-label="Home"></section>
  <section id="view-map" class="view" aria-label="Learning map"></section>
  <section id="view-lesson" class="view" aria-label="Lesson"></section>
  <section id="view-lab" class="view" aria-label="Security lab"></section>
  <section id="view-progress" class="view" aria-label="Progress"></section>
  <section id="view-boss" class="view" aria-label="Final boss"></section>
</main>

<nav class="mobilenav" id="mnav" aria-label="Mobile navigation">
  <button data-go="home" class="on"><b>⌂</b>Home</button>
  <button data-go="map"><b>◈</b>Map</button>
  <button data-go="lab"><b>⌘</b>Lab</button>
  <button data-go="progress"><b>▤</b>Progress</button>
  <button data-go="boss"><b>★</b>Boss</button>
</nav>

<div id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   DroidSec Lab — single-file interactive Android security course
   ===================================================================== */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function hl(code){
  const e = esc(code);
  return e.replace(
    /("[^"\n]*"|'[^'\n]*')|(\/\/[^\n]*|#(?!\[)[^\n]*|\/\*[\s\S]*?\*\/)|\b(public|private|protected|static|final|class|void|new|return|if|else|import|package|true|false|null|String|Intent|Bundle|Uri|WebView|SQLiteDatabase|Cursor|CursorFactory|SELECT|FROM|WHERE|CREATE|TABLE|INSERT|INTO|VALUES|AND|OR|DROP|UPDATE|DELETE|android|xmlns|exported|permission|fun|val|var|override|SharedPreferences|PendingIntent|Keystore|KeyStore)\b/g,
    (m, str, com, kw) => str ? `<span class="tk-s">${str}</span>`
                     : com ? `<span class="tk-c">${com}</span>`
                     : `<span class="tk-k">${kw}</span>`
  );
}

/* ------------------------------- CATEGORIES ------------------------------- */
const CATS = {
  comp:{ name:'Android Components',       color:'#4ea8ff', icon:'◈' },
  web: { name:'Web & Input',              color:'#b06bff', icon:'◇' },

function levelOf(xp){ return Math.floor(xp/500)+1; }

function refreshXP(){
  const lv = levelOf(S.xp);
  $('#lvlchip').textContent = 'LVL ' + lv;

}

  S.xp += n; refreshXP(); save();
  toast(`+${n} XP — ${why}`);

function toast(msg, ms=2400){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('on'), ms);
}
function today(){ return new Date().toISOString().slice(0,10); }
function bumpStreak(){
  const d = today();
  if(S.lastDay === d) return;
  const y = new Date(Date.now()-864e5).toISOString().slice(0,10);
  S.streak = (S.lastDay === y) ? S.streak+1 : 1;
  S.lastDay = d; save();
}
bumpStreak();

function catStats(){
  const out = {};
  CATKEYS.forEach(k=>{
    const list = TOPICS.filter(t=>t.cat===k);
    const done = list.filter(t=>S.completed[t.id]).length;
    out[k] = { done, total:list.length, pct: done/list.length*100 };
  });
  return out;
}
function isUnlocked(t){
  if(S.freeUnlock) return true;
  const list = TOPICS.filter(x=>x.cat===t.cat);
  const i = list.findIndex(x=>x.id===t.id);
  if(i <= 0) return true;
  return !!S.completed[list[i-1].id];
}
function completedCount(){ return TOPICS.filter(t=>S.completed[t.id]).length; }

const STEPS = ['What is it?','Visualize','Attack sim','Why it works','Code','Fix it','Quiz','Scenario','Explain it','Reward'];
let L = null;

function openLesson(id){
  const t = BY_ID[id];
  L = { t, i:0, done:{}, quiz:{}, eli5:false, shown:false, codeView:'vuln', quizIdx:0, quizRight:0 };
  $$('.view').forEach(v=>v.classList.remove('on'));
  $('#view-lesson').classList.add('on');
  $$('#nav button, #mnav button').forEach(b=>b.classList.remove('on'));
  renderLesson();
  window.scrollTo({top:0,behavior:'auto'});
}

function stepDone(n, silent){
  L.done[n] = true;
  if(!silent) renderLesson();
}
function canGo(n){
  for(let i=0;i<n;i++) if(!L.done[i]) return false;
  return true;
}
function renderLesson(){
  const t = L.t, c = CATS[t.cat];
  const total = STEPS.length;
  const pct = Object.keys(L.done).length/total*100;

  $('#view-lesson').innerHTML = `
  <div class="row" style="margin-bottom:14px">
    <button class="btn sm ghost" data-go="map">← Back to map</button>
    <span class="pill" style="border-color:${c.color}66;color:${c.color}">${c.icon} ${c.name}</span>
    <span class="pill">LVL ${t.lvl} · ${LEVELNAME[t.lvl]}</span>
    <span class="pill">${t.mins} min</span>
  </div>

  <div class="lesshead">
    <div>
      <h2 style="margin-bottom:4px">${t.title}</h2>
      <p class="muted tiny" style="margin:0">${t.take}</p>
    </div>
  </div>

  <div class="stepper" role="tablist" aria-label="Lesson steps">
    ${STEPS.map((s,i)=>{
      const ok = L.done[i], cur = i===L.i, lock = !canGo(i);
      return `<button role="tab" aria-selected="${cur}" data-step="${i}"
        class="${cur?'on':''} ${ok?'done':''}" ${lock?'disabled':''}
        title="${lock?'Locked — complete previous steps':s}">${ok&&!cur?'✓ ':''}${i+1}. ${s}</button>`;
    }).join('')}

    <button class="btn primary" id="nextBtn" ${(!L.done[L.i]||L.i===total-1)?'disabled':''}>
      ${L.i===total-1?'Done':'Next step →'}
    </button>
  </div>`;

  $$('#view-lesson .stepper button').forEach(b=>{
    b.onclick = ()=>{
      const i = +b.dataset.step;
      if(!canGo(i)){ toast('🔒 Complete the earlier steps first.'); return; }

  });
  $('#prevBtn').onclick = ()=>{ if(L.i>0){ L.i--; renderLesson(); } };
  $('#nextBtn').onclick = ()=>{ if(L.done[L.i] && L.i<total-1){ L.i++; renderLesson(); } };

}

    box.innerHTML = `
      <div class="card">
        <div class="kicker p">🔍 Why does this work?</div>
        <p class="muted tiny">Click every step to reveal the mechanism. All five must be opened.</p>
      </div>
      <div id="stepsWrap" class="grid" style="gap:8px">
        ${t.steps.map((s,i)=>`
          <button class="qopt" data-why="${i}" style="margin:0">
            <span class="k">${i+1}</span><span>${s}</span>
          </button>`).join('')}
      </div>
      <div id="whyDone" class="tiny muted" style="margin-top:10px">0 / ${t.steps.length} opened</div>`;
    let opened = 0; const seen = new Set();
    $$('#stepsWrap .qopt').forEach(b=>{
      b.onclick = ()=>{
        const i = +b.dataset.why;
        if(!seen.has(i)){
          seen.add(i); opened++;
          b.classList.add('right');
          $('#whyDone').textContent = `${opened} / ${t.steps.length} opened`;
        }
        b.classList.toggle('wrong');
        if(opened===t.steps.length && !L.done[3]) stepDone(3);
      };
    });
  }

  /* ---------- 5. CODE EXPLORER ---------- */
  if(step===4){
    box.innerHTML = `
      <div class="card">
        <div class="kicker b">💻 Code explorer</div>
        <div class="row" style="margin-bottom:12px">
          <button class="btn sm ${L.codeView==='vuln'?'primary':''}" id="cvVuln">VULNERABLE</button>
          <button class="btn sm ${L.codeView==='fix'?'primary':''}" id="cvFix">SECURE</button>
        </div>
        <div id="codeBox"></div>
        <p class="tiny muted" id="codeNote" style="margin-top:10px"></p>
      </div>`;
    const paint = ()=>{
      const isV = L.codeView==='vuln';
      const block = isV ? t.vuln : t.fix;
      $('#codeBox').innerHTML = `<pre class="code ${isV?'vuln':'fix'}">${hl(block.code)}</pre>`;
      $('#codeNote').innerHTML = isV
        ? '⚠️ This is the shape of code that creates the vulnerability.'
        : '✅ This is the shape of code that removes it. Notice how the attacker-controlled value never becomes an instruction.';
    };
    paint();
    const viewed = {vuln:true, fix:false};
    $('#cvVuln').onclick = ()=>{ L.codeView='vuln'; viewed.vuln=true; paint();
      $('#cvVuln').classList.add('primary'); $('#cvFix').classList.remove('primary'); check(); };
    $('#cvFix').onclick = ()=>{ L.codeView='fix'; viewed.fix=true; paint();
      $('#cvFix').classList.add('primary'); $('#cvVuln').classList.remove('primary'); check(); };
    function check(){ if(viewed.vuln && viewed.fix && !L.done[4]) stepDone(4); }
  }

  /* ---------- 6. FIX IT YOURSELF ---------- */
  if(step===5){
    box.innerHTML = `
      <div class="card">
        <div class="kicker g">🔧 Fix it yourself</div>
        <p class="big">${t.fixq.q}</p>
        <div id="fixOpts">
          ${t.fixq.opts.map((o,i)=>`<button class="qopt" data-fix="${i}"><span class="k">${'ABC'[i]}</span><span>${o.t}</span></button>`).join('')}
        </div>
        <div id="fixFb"></div>
      </div>`;
    $$('#fixOpts .qopt').forEach(b=>{
      b.onclick = ()=>{
        const o = t.fixq.opts[+b.dataset.fix];
        $$('#fixOpts .qopt').forEach(x=>x.disabled = true);
        b.classList.add(o.ok?'right':'wrong');
        $('#fixFb').innerHTML = `<div class="feedback ${o.ok?'ok':'no'}">
          <b>${o.ok?'✅ Correct':'❌ Not quite'}</b> — ${o.why}
          ${o.ok?'':'<br><button class="btn sm" style="margin-top:10px" id="retryFix">↻ Try again</button>'}
        </div>`;
        if(o.ok){ if(!L.done[5]) stepDone(5); }
        else $('#retryFix').onclick = ()=>{ renderLesson(); };
      };
    });
  }

  /* ---------- 7. QUIZ ---------- */
  if(step===6){
    const q = t.quiz[L.quizIdx];
    const answered = L.quiz[L.quizIdx];
    box.innerHTML = `
      <div class="card">
        <div class="kicker w">🎯 Mini quiz — ${L.quizIdx+1} / ${t.quiz.length}</div>
        <p class="big">${q.q}</p>
        <div id="quizOpts">
          ${q.opts.map((o,i)=>{
            let cls='';
            if(answered!==undefined) cls = (i===q.a)?'right':(i===answered?'wrong':'');
            return `<button class="qopt ${cls}" data-q="${i}" ${answered!==undefined?'disabled':''}>
              <span class="k">${'ABCD'[i]}</span><span>${o}</span></button>`;
          }).join('')}
        </div>
        <div id="quizFb">
          ${answered!==undefined?`<div class="feedback ${answered===q.a?'ok':'no'}">
            <b>${answered===q.a?'✅ Correct':'❌ Not quite'}</b> — ${q.e}
            ${answered!==q.a?'<br><button class="btn sm" style="margin-top:10px" id="retryQ">↻ Retry this question</button>':''}
          </div>`:''}
        </div>
        <div class="row" style="margin-top:12px">
          <button class="btn" id="nextQ" ${answered===undefined?'disabled':''}>
            ${L.quizIdx < t.quiz.length-1 ? 'Next question →' : 'Finish quiz'}
          </button>
          <span class="tiny muted">Score: ${L.quizRight}/${t.quiz.length}</span>
        </div>
      </div>`;

    $$('#quizOpts .qopt').forEach(b=>{
      b.onclick = ()=>{
        if(L.quiz[L.quizIdx]!==undefined) return;
        const i = +b.dataset.q;
        L.quiz[L.quizIdx] = i;
        if(i===q.a) L.quizRight++;
        renderLesson();
      };
    });
    const rq = $('#retryQ');
    if(rq) rq.onclick = ()=>{ delete L.quiz[L.quizIdx]; renderLesson(); };
    $('#nextQ').onclick = ()=>{
      if(L.quizIdx < t.quiz.length-1){ L.quizIdx++; renderLesson(); }
      else{
        if(L.quizRight === t.quiz.length){ if(!L.done[6]) stepDone(6); }
        else toast('Answer every question correctly to continue — retry the red ones.');
      }
    };
    // Gate: if the quiz is incomplete, the step can't be done.
  }

  /* ---------- 8. SCENARIO ---------- */
  if(step===7){
    box.innerHTML = `
      <div class="card">
        <div class="kicker p">🕵️ Real-world scenario</div>
        <p class="big">${t.scen.q}</p>
        <div id="scenOpts">
          ${t.scen.opts.map((o,i)=>`<button class="qopt" data-s="${i}"><span class="k">${'ABCD'[i]}</span><span>${o}</span></button>`).join('')}
        </div>
        <div id="scenFb"></div>
      </div>`;
    $$('#scenOpts .qopt').forEach(b=>{
      b.onclick = ()=>{
        const i = +b.dataset.s, ok = i===t.scen.a;
        $$('#scenOpts .qopt').forEach(x=>x.disabled=true);
        b.classList.add(ok?'right':'wrong');
        $$('#scenOpts .qopt')[t.scen.a].classList.add('right');
        $('#scenFb').innerHTML = `<div class="feedback ${ok?'ok':'no'}">
          <b>${ok?'✅ Correct reasoning':'❌ Different answer'}</b> — ${t.scen.e}
          ${ok?'':'<br><button class="btn sm" style="margin-top:10px" id="retryS">↻ Try again</button>'}
        </div>`;
        if(ok){ if(!L.done[7]) stepDone(7); }
        else $('#retryS').onclick = ()=>renderLesson();
      };
    });
  }

  /* ---------- 9. KNOWLEDGE CHECK ---------- */
  if(step===8){
    box.innerHTML = `
      <div class="card">
        <div class="kicker b">🧠 Knowledge check</div>
        <p class="big">Explain <b>${t.title}</b> in your own words.</p>
        <p class="tiny muted">Cover all four: what it is · why it happens · how you would detect it · how you would fix it.</p>
        <textarea id="kcText" rows="7" style="width:100%;background:#080d15;border:1px solid var(--line2);border-radius:10px;color:var(--txt);padding:12px;font-family:var(--mono);font-size:13px;resize:vertical"
          placeholder="Type your explanation here…"></textarea>
        <div class="row" style="margin-top:12px">
          <button class="btn primary" id="kcCheck">Check my answer</button>
          <button class="btn sm" id="kcHint">💡 Show rubric</button>
        </div>
        <div id="kcFb"></div>
      </div>`;
    $('#kcHint').onclick = ()=>{
      $('#kcFb').innerHTML = `<div class="feedback ok" style="margin-top:12px">
        <b>Rubric</b><br>
        1. <b>What</b> — keywords: ${t.keys[0].map(k=>`<code class="inline">${k}</code>`).join(' ')}<br>
        2. <b>Why</b> — keywords: ${t.keys[1].map(k=>`<code class="inline">${k}</code>`).join(' ')}<br>
        3. <b>Detect</b> — keywords: ${t.keys[2].map(k=>`<code class="inline">${k}</code>`).join(' ')}<br>
        4. <b>Fix</b> — keywords: ${t.keys[3].map(k=>`<code class="inline">${k}</code>`).join(' ')}<br>
        <span class="tiny muted">You need at least 3 of the 4 areas covered.</span>
      </div>`;
    };
    $('#kcCheck').onclick = ()=>{
      const txt = ($('#kcText').value||'').toLowerCase();
      if(txt.trim().length < 25){ toast('Write a little more — at least a couple of sentences.'); return; }
      const hits = t.keys.map(group => group.some(k => txt.includes(k.toLowerCase())));
      const score = hits.filter(Boolean).length;
      const labels = ['What it is','Why it happens','How to detect','How to fix'];
      $('#kcFb').innerHTML = `<div class="feedback ${score>=3?'ok':'no'}" style="margin-top:12px">
        <b>${score>=3?'✅ Strong explanation':'⚠️ Needs a bit more'}</b> — ${score}/4 areas covered.
        <div class="row" style="margin-top:8px">
          ${labels.map((l,i)=>`<span class="pill ${hits[i]?'g':'r'}">${hits[i]?'✓':'✗'} ${l}</span>`).join('')}
        </div>
        ${score<3?`<p style="margin:10px 0 0" class="tiny">Missing: ${labels.filter((_,i)=>!hits[i]).join(', ')}. Try rewriting with those angles.</p>
          <button class="btn sm" style="margin-top:10px" id="kcRetry">↻ Try again</button>`
        :`<p style="margin:10px 0 0" class="tiny">That is exactly how you would write it in a security report.</p>`}
      </div>`;
      const r = $('#kcRetry'); if(r) r.onclick = ()=>{ $('#kcFb').innerHTML=''; };
      if(score>=3){ if(!L.done[8]) stepDone(8); }
    };
  }

  /* ---------- 10. REWARD ---------- */
  if(step===9){
    const prev = S.completed[t.id];
    const first = !prev;
    box.innerHTML = `
      <div class="card good" style="text-align:center;padding:34px 22px">
        <div style="font-size:52px;line-height:1">${first?'🏆':'✅'}</div>
        <h2 style="margin-top:8px">${first?'Topic complete!':'Already completed'}</h2>
        <p class="big muted">${t.title}</p>
        ${first?`<p class="big" style="color:var(--acc);font-weight:800">+100 XP</p>`:
               `<p class="muted">Replay reward: +20 XP</p>`}
        <div style="max-width:420px;margin:18px auto 0;text-align:left">
          <div class="tiny muted">Understanding</div>
          <div class="pbar"><i style="width:${Math.round((L.quizRight/t.quiz.length)*100)}%"></i></div>
          <div class="tiny muted">Confidence</div>
          <div class="pbar"><i style="width:${Object.keys(L.done).length/10*100}%"></i></div>
          <div class="tiny muted">Topics completed</div>
          <div class="pbar"><i style="width:${(completedCount()+(first?1:0))/30*100}%"></i></div>
          <p class="tiny muted">${completedCount()+(first?1:0)} / 30 topics</p>
        </div>
        <div class="row" style="justify-content:center;margin-top:18px">
          <button class="btn primary" id="finishBtn" ${first?'':'disabled'}>Claim & continue</button>
          <button class="btn" data-go="map">Back to map</button>
        </div>
      </div>`;

    const fin = $('#finishBtn');
    if(fin) fin.onclick = ()=>{
      S.completed[t.id] = { score: Math.round(L.quizRight/t.quiz.length*100), ts: Date.now() };
      award(100, 'Topic mastered: ' + t.title);
      save();
      const next = TOPICS.filter(x=>x.cat===t.cat)[ TOPICS.filter(x=>x.cat===t.cat).findIndex(x=>x.id===t.id) + 1 ];
      if(next && !S.completed[next.id]) openLesson(next.id);
      else go('map');
    };
    if(!L.done[9]) L.done[9] = true;
  }
}

/* =====================================================================
   VISUALIZATION RENDERERS
   ===================================================================== */
function mountViz(t, host, done){
  const v = t.viz;
  if(v.type==='pipe')  return vizPipe(v, host, done);
  if(v.type==='toggle')return vizToggle(v, host, done);
  if(v.type==='stack') return vizStack(v, host, done);
  if(v.type==='overlay')return vizOverlay(v, host, done);
  if(v.type==='intent')return vizIntent(v, host, done);
  if(v.type==='tree')  return vizTree(v, host, done);
  if(v.type==='net')   return vizNet(host, done);
  if(v.type==='oauth') return vizOAuth(host, done);
  if(v.type==='keystore') return vizKeystore(host, done);
  host.innerHTML = '<p class="muted">Visualization unavailable.</p>';
}

/* --- generic pipeline --- */
function vizPipe(v, host, done){
  host.innerHTML = `
    <div class="pipe" id="pipeNodes">
      ${v.nodes.map((n,i)=>`<span class="node" data-n="${i}">${n}</span>${i<v.nodes.length-1?'<span class="arrow">→</span>':''}`).join('')}
    </div>
    <p class="tiny muted" style="text-align:center;margin:14px 0 8px">Choose an input and send it through the pipeline:</p>
    <div class="row" style="justify-content:center">
      ${v.payloads.map((p,i)=>`<button class="chip" data-p="${i}">${esc(p.label)}</button>`).join('')}
    </div>
    <div id="pipeOut" style="margin-top:16px;text-align:center"></div>`;

  host.querySelectorAll('.chip').forEach(b=>{
    b.onclick = async ()=>{
      const p = v.payloads[+b.dataset.p];
      host.querySelectorAll('.chip').forEach(x=>x.classList.remove('on','bad','good'));
      b.classList.add('on', p.safe?'good':'bad');
      const nodes = host.querySelectorAll('#pipeNodes .node');
      nodes.forEach(n=>n.className='node');
      $('#pipeOut').innerHTML = '<span class="pill">running…</span>';
      for(let i=0;i<nodes.length;i++){
        await sleep(320);
        nodes[i].classList.add(i===nodes.length-1 ? (p.safe?'good':'bad') : 'act');
      }
      await sleep(260);
      $('#pipeOut').innerHTML = `<div class="feedback ${p.safe?'ok':'no'}">${esc(p.out)}</div>`;
      done();
    };
  });
}
const sleep = ms => new Promise(r=>setTimeout(r, S.nomotion?0:ms));

        <span class="node ${on?'bad':'good'}">${on?'Exposed':'Protected'}</span>
      </div>
      <div class="feedback ${on?'no':'ok'}" style="margin-top:14px">
        <b>${esc(s.title)}</b> — ${esc(s.body)}
        <div style="margin-top:8px"><span class="pill ${on?'r':'g'}">RISK: ${s.risk}</span></div>
      </div>`;
    $('#tg').onclick = ()=>{ on=!on; paint(); done(); };
  };
  paint();
}

/* --- task stack --- */
function vizStack(v, host, done){
  let injected = false;
  const paint = ()=>{
    const stack = injected
      ? ['<span class="muted">Banking — LoginActivity (bottom)</span>','Banking — AccountActivity','<b>'+v.evil+'</b> — fake login (TOP)']
      : ['Banking — LoginActivity','Banking — AccountActivity','Banking — TransferActivity'];
    host.innerHTML = `
      <div class="row" style="justify-content:center;margin-bottom:14px">
        <span class="tiny muted">taskAffinity: <code class="inline">${v.affin}</code></span>
        <button class="btn sm ${injected?'primary':''}" id="inj">
          ${injected?'👾 Malicious Activity in task':'📱 Normal task stack'}
        </button>
      </div>
      <div class="stack">
        ${stack.map((s,i)=>{
          const isEvil = injected && i===stack.length-1;
          const isTop = i===stack.length-1;
          return `<div class="stackcard ${isEvil?'evil':''} ${isTop&&!injected?'top':''}">${s}</div>`;
        }).join('')}
      </div>
      <div class="feedback ${injected?'no':'ok'}" style="margin-top:16px">
        ${injected
          ? '<b>Task hijacked.</b> The malicious Activity shares your taskAffinity and lands on top of your stack. The user taps your icon and sees the attacker screen.'
          : '<b>Normal behaviour.</b> Every Activity in the stack belongs to the app the user launched.'}
      </div>`;
    $('#inj').onclick = ()=>{ injected=!injected; paint(); done(); };
  };
  paint();
}

/* --- tapjacking overlay --- */
function vizOverlay(v, host, done){
  let overlay = false, filter = false, clicks = 0;
  const paint = ()=>{
    host.innerHTML = `
      <div class="row" style="justify-content:center;margin-bottom:14px">
        <button class="btn sm ${overlay?'primary':''}" id="ov">Overlay: ${overlay?'ON':'OFF'}</button>
        <button class="btn sm ${filter?'primary':''}" id="ft">filterTouchesWhenObscured: ${filter?'ON':'OFF'}</button>
      </div>
      <div class="phone"><div class="scr">
        <div class="notch"></div>
        <div class="screenrow"><span>💬 Chat bubble (attacker overlay)</span></div>
        <div class="screenrow" style="background:#101a2b">Your balance: $4,120.55</div>
        <div class="screenrow" id="target" style="cursor:pointer;background:#1a2436;border-color:#2b3b52">
          <b>Confirm payment of $499</b>
        </div>
        <div class="screenrow muted tiny">Tap the row above to simulate a touch.</div>
        <div class="overlaybox ${overlay?'on':''}">TRANSPARENT ATTACKER OVERLAY</div>
      </div></div>
      <div id="ovOut" class="feedback ok" style="margin-top:16px">
        ${overlay
          ? (filter
             ? '<b>Touch rejected.</b> The View detected FLAG_WINDOW_IS_OBSCURED and refused to act. The attack fails.'
             : '<b>Touch delivered to the hidden control.</b> The user thinks they tapped the overlay, but the payment button received the tap.')
          : 'No overlay. Taps go where the user expects them to go.'}
      </div>`;
    $('#ov').onclick = ()=>{ overlay=!overlay; paint(); done(); };
    $('#ft').onclick = ()=>{ filter=!filter; paint(); done(); };
    const tg = $('#target');
    tg.onclick = ()=>{
      clicks++;
      if(overlay && !filter){ tg.classList.add('hit'); tg.innerHTML = '<b>💸 PAYMENT SENT — you never meant to tap this</b>'; }
      else if(overlay && filter){ tg.classList.remove('hit'); tg.innerHTML = '<b>🛡 Touch ignored (obscured)</b>'; }
      else { tg.classList.add('sel'); tg.innerHTML = '<b>✔ Payment confirmed by the user</b>'; }
      setTimeout(paint, 1400);
      done();
    };
  };
  paint();
}

/* --- intent graph --- */
function vizIntent(v, host, done){
  let explicit = (v.mode === 'explicit');
  const paint = ()=>{
    host.innerHTML = `
      <div class="row" style="justify-content:center;margin-bottom:14px">
        <button class="btn sm ${explicit?'primary':''}" id="mode">
          ${explicit?'EXPLICIT INTENT (names a component)':'IMPLICIT INTENT (resolved by filter)'}
        </button>
      </div>
      <div class="grid g2" style="gap:16px">
        <div class="card tight">
          <div class="kicker b">APP A — your app</div>
          ${['Activity','Service','Receiver','Provider'].map(c=>`<div class="screenrow" data-c="${c}">${c}</div>`).join('')}
        </div>
        <div class="card tight" style="${explicit?'opacity:.45':''}">
          <div class="kicker r">APP B — untrusted</div>
          ${['Activity','Service','Receiver','Provider'].map(c=>`<div class="screenrow" data-c2="${c}">${c}</div>`).join('')}
        </div>
      </div>
      <div class="row" style="justify-content:center;margin-top:14px">
        <button class="btn primary" id="send">▶ Send Intent</button>
      </div>
      <div id="iOut" class="feedback ok" style="margin-top:14px">
        Click a component in App A, then send the Intent to see who receives it.
      </div>`;

    let picked = null;
    host.querySelectorAll('[data-c]').forEach(el=>{
      el.onclick = ()=>{ picked = el.dataset.c;
        host.querySelectorAll('[data-c]').forEach(x=>x.classList.remove('sel'));
        el.classList.add('sel');
        $('#iOut').innerHTML = `<b>Target:</b> App A · ${picked}`;
      };
    });
    $('#mode').onclick = ()=>{ explicit=!explicit; paint(); done(); };
    $('#send').onclick = async ()=>{
      if(!picked){ toast('Pick a component in App A first.'); return; }
      const nodes = host.querySelectorAll('#iOut');
      if(explicit){
        const el = host.querySelector(`[data-c="${picked}"]`);
        el.classList.add('sel');
        $('#iOut').innerHTML = `<div class="feedback ok"><b>Delivered to App A · ${picked}.</b> The Intent names the exact component, so no other app can be chosen. App B is never a candidate.</div>`;
      } else {
        const el = host.querySelector(`[data-c2="${picked}"]`);
        await sleep(400);
        el.classList.add('hit');
        el.classList.add('sel');
        $('#iOut').innerHTML = `<div class="feedback no"><b>Intercepted by App B · ${picked}.</b> With an implicit Intent, any app with a matching intent-filter can be resolved — including the attacker's.</div>`;
      }
      done();
    };
  };
  paint();
}

            style="flex:1;min-width:180px;background:#080d15;border:1px solid var(--line2);border-radius:9px;color:var(--txt);padding:10px;font-family:var(--mono);font-size:12.5px"
            aria-label="Path to open" />
          <button class="btn sm primary" id="openPath">Open</button>
        </div>
        <div id="pathOut" style="margin-top:12px"></div>
      </div>
    </div>`;
  const open = ()=>{
    const raw = $('#pathIn').value.trim();
    const norm = raw.replace(/\\/g,'/');
    if(norm.includes('..')){
      $('#pathOut').innerHTML = `<div class="feedback no">
        <b>🚨 Path traversal detected.</b> The raw path <code class="inline">${esc(norm)}</code> escapes the intended base directory.
        A naive <code class="inline">new File(base, userPath)</code> would happily resolve it and read something it never should.
        The fix is <code class="inline">getCanonicalFile()</code> plus a containment check against the canonical base.
      </div>`;
      done(); return;
    }
    const hit = Object.keys(files).find(f => norm.endsWith(f) || f.endsWith(norm));
    $('#pathOut').innerHTML = hit
      ? `<div class="feedback ${files[hit].startsWith('⚠️')||files[hit].startsWith('🔑')?'no':'ok'}"><b>${esc(hit)}</b><br>${files[hit]}</div>`
      : `<div class="feedback no">File not found in the simulated sandbox. Try one of the paths shown on the left.</div>`;
    done();
  };
  $('#openPath').onclick = open;
  $('#pathIn').addEventListener('keydown', e=>{ if(e.key==='Enter') open(); });
}

/* --- network --- */
function vizNet(host, done){
  let mode = 'https';
  const paint = ()=>{
    const map = {
      https:{ cls:'good', label:'HTTPS + valid certificate', out:'<b>Encrypted and verified.</b> The client validates the chain, the handshake completes, and the MITM proxy cannot decrypt the traffic.' },
      http:{ cls:'bad', label:'HTTP (cleartext)', out:'<b>Cleartext.</b> Anyone on the same network reads the request and the response. Passwords and tokens are visible in plain text.' },
      badcert:{ cls:'bad', label:'HTTPS but certificate not validated', out:'<b>Intercepted.</b> The app accepts any certificate, so a proxy CA is trusted and every request is decrypted and can be modified in flight.' }
    };
    const m = map[mode];
    host.innerHTML = `
      <div class="row" style="justify-content:center;margin-bottom:16px">
        ${['https','http','badcert'].map(k=>`<button class="chip ${mode===k?'on':''}" data-m="${k}">
          ${k==='https'?'HTTPS ✓':k==='http'?'HTTP ✗':'HTTPS, cert not validated'}</button>`).join('')}
      </div>
      <div class="pipe">
        <span class="node">📱 Android app</span><span class="arrow">→</span>
        <span class="node ${m.cls}">${m.label}</span><span class="arrow">→</span>
        <span class="node">🖥 Server</span>
      </div>
      <div class="pipe" style="margin-top:6px">
        <span class="node ${mode==='https'?'good':'bad'}">🕵 Attacker on network</span>
        <span class="arrow">${mode==='https'?'✕ blocked':'✓ reads everything'}</span>
      </div>
      <div class="feedback ${mode==='https'?'ok':'no'}" style="margin-top:14px">${m.out}</div>`;
    host.querySelectorAll('.chip').forEach(b=>b.onclick = ()=>{ mode = b.dataset.m; paint(); done(); });
  };
  paint();
}

function vizOAuth(host, done){

  const paint = ()=>{
    host.innerHTML = `
      <div class="row" style="justify-content:center;margin-bottom:14px">
        <button class="btn sm ${pkce?'primary':''}" id="pk">PKCE: ${pkce?'ENABLED':'DISABLED'}</button>
        <button class="btn sm ${pkce?'':'primary'}" id="wb">Browser: ${pkce?'System browser':'Embedded WebView'}</button>
      </div>
      <div class="pipe" style="flex-direction:column;align-items:stretch;gap:8px">
        ${steps.map((s,i)=>`<div class="screenrow ${i===2&&!pkce?'hit':(i===2&&pkce?'sel':'')}" style="justify-content:space-between">
          <span><b>${i+1}. ${s}</b></span>
          <span class="tiny muted">${stepNote(i)}</span>
        </div>`).join('')}
      </div>
      <div class="feedback ${pkce?'ok':'no'}" style="margin-top:14px">
        ${pkce
          ? '<b>PKCE enabled.</b> The app sends a hashed code_challenge and later proves it with the original verifier. An intercepted authorization code is useless to anyone else, and the system browser keeps the password away from the app.'
          : '<b>No PKCE.</b> An intercepted authorization code can be exchanged by any app that grabbed the redirect. In an embedded WebView, the host app can also read the password the user types.'}
      </div>`;
    $('#pk').onclick = ()=>{ pkce=!pkce; paint(); done(); };

      return '';
    }
  };
  paint();
}

function radar(st){
  const cx=180, cy=170, R=120;
  const pts = CATKEYS.map((k,i)=>{
    const a = -Math.PI/2 + i*(2*Math.PI/CATKEYS.length);
    const pct = st[k].pct/100;
    return { x: cx + Math.cos(a)*R*pct, y: cy + Math.sin(a)*R*pct,
             ax: cx + Math.cos(a)*R, ay: cy + Math.sin(a)*R,
             lx: cx + Math.cos(a)*(R+26), ly: cy + Math.sin(a)*(R+26),
             name: CATS[k].name.split(' ')[0], pct: Math.round(st[k].pct) };
  });
  return `<svg class="radar" viewBox="0 0 360 350" role="img" aria-label="Radar chart of category mastery">
    ${[0.25,0.5,0.75,1].map(f=>`<polygon points="${CATKEYS.map((_,i)=>{
      const a=-Math.PI/2+i*(2*Math.PI/CATKEYS.length);
      return `${cx+Math.cos(a)*R*f},${cy+Math.sin(a)*R*f}`;}).join(' ')}"
      fill="none" stroke="#1e2a3c" stroke-width="1"/>`).join('')}
    ${pts.map(p=>`<line x1="${cx}" y1="${cy}" x2="${p.ax}" y2="${p.ay}" stroke="#1e2a3c"/>`).join('')}
    <polygon points="${pts.map(p=>`${p.x},${p.y}`).join(' ')}" fill="rgba(61,220,151,.20)" stroke="#3ddc97" stroke-width="2"/>
    ${pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="#3ddc97"/>`).join('')}
    ${pts.map(p=>`<text x="${p.lx}" y="${p.ly}" fill="#8fa2ba" font-size="9.5" text-anchor="middle" font-family="monospace">${p.name} ${p.pct}%</text>`).join('')}
  </svg>`;
}

let reviewState = null;
function startReview(){
  const pool = TOPICS.filter(t=>S.completed[t.id]);
  const picks = shuffle(pool).slice(0, Math.min(5, pool.length));
  reviewState = { picks, i:0, right:0 };
  paintReview();
}
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function paintReview(){
  const box = $('#reviewBox');
  if(!reviewState){ return; }
  const { picks, i, right } = reviewState;
  if(i>=picks.length){
    const pct = Math.round(right/picks.length*100);
    box.innerHTML = `<div class="feedback ${pct>=60?'ok':'no'}">
      <b>Review complete — ${right}/${picks.length} correct (${pct}%).</b><br>
      ${pct>=60?'Your understanding is holding up. Try a harder branch next.':'Revisit the weak topics above and re-run this session.'}
      <div class="row" style="margin-top:10px"><button class="btn sm" id="againR">↻ New review set</button></div>
    </div>`;
    $('#againR').onclick = startReview;
    if(pct>=60) award(25,'Review session passed');
    return;
  }
  const t = picks[i];
  box.innerHTML = `
    <div class="card tight">
      <div class="kicker p">Review ${i+1}/${picks.length}</div>
      <p class="big">${t.scen.q}</p>
      ${t.scen.opts.map((o,k)=>`<button class="qopt" data-r="${k}"><span class="k">${'ABCD'[k]}</span><span>${o}</span></button>`).join('')}
      <div id="rFb"></div>
    </div>`;
  box.querySelectorAll('.qopt').forEach(b=>{
    b.onclick = ()=>{
      const k = +b.dataset.r, ok = k===t.scen.a;
      box.querySelectorAll('.qopt').forEach(x=>x.disabled=true);
      b.classList.add(ok?'right':'wrong');
      box.querySelectorAll('.qopt')[t.scen.a].classList.add('right');
      $('#rFb').innerHTML = `<div class="feedback ${ok?'ok':'no'}"><b>${ok?'✅':'❌'}</b> ${t.scen.e}
        <div class="row" style="margin-top:8px">
          <button class="btn sm" id="rNext">Next →</button>
          ${ok?'':'<button class="btn sm" id="rOpen">Open the lesson</button>'}
        </div></div>`;
      if(ok) reviewState.right++;
      $('#rNext').onclick = ()=>{ reviewState.i++; paintReview(); };
      const ro = $('#rOpen'); if(ro) ro.onclick = ()=>openLesson(t.id);
    };
  });
}

    checks:[
      { re:/"\s*\+\s*\w+\s*\+\s*"/, bad:true, msg:'String concatenation puts user input directly into the SQL grammar → SQL injection.' },
      { re:/rawQuery\([^,]+,\s*null\s*\)/, bad:true, msg:'Passing null instead of selectionArgs means nothing is bound as a parameter.' }
    ],
    fixNote:'Use "WHERE name = ?" with new String[]{ input } so input is bound as data, never as SQL.' },
  { id:'webview', label:'WebView configuration', lang:'java',
    code:`webView.getSettings().setJavaScriptEnabled(true);
webView.addJavascriptInterface(new Bridge(), "bridge");
webView.getSettings().setAllowFileAccess(true);`,
    checks:[
      { re:/addJavascriptInterface/, bad:true, msg:'A JavaScript bridge lets page script call native Java methods — XSS becomes native execution.' },
      { re:/setAllowFileAccess\(true\)/, bad:true, msg:'File access lets a page read file:// URLs inside your sandbox.' },
      { re:/setJavaScriptEnabled\(true\)/, bad:false, msg:'JavaScript itself is not a bug — but combined with untrusted content and a bridge it is dangerous.' }
    ],
    fixNote:'Disable JavaScript and file access for untrusted content, and never expose a bridge to it.' },
  { id:'pending', label:'PendingIntent flags', lang:'java',
    code:`Intent i = new Intent(this, AdminActivity.class);
PendingIntent pi = PendingIntent.getActivity(this, 0, i, 0);`,
    checks:[
      { re:/FLAG_IMMUTABLE/, bad:true, invert:true, msg:'No FLAG_IMMUTABLE — the receiving app can modify the wrapped Intent (fill-in attack).' },
      { re:/new Intent\(this,\s*AdminActivity\.class\)/, bad:false, msg:'Good: the Intent names an explicit component.' }
    ],
    fixNote:'Add PendingIntent.FLAG_IMMUTABLE and keep the wrapped Intent as specific as possible.' },
  { id:'network', label:'Network security config', lang:'xml',
    code:`<base-config cleartextTrafficPermitted="true">
    <trust-anchors><certificates src="system"/></trust-anchors>
</base-config>`,
    checks:[
      { re:/cleartextTrafficPermitted\s*=\s*"true"/, bad:true, msg:'Cleartext is permitted globally, so HTTP traffic can be read and modified on the network.' }
    ],
    fixNote:'Set cleartextTrafficPermitted="false" globally, then allow it only for specific development hosts.' },
  { id:'secret', label:'Secrets in code', lang:'java',
    code:`private static final String API_KEY = "sk_live_9f2b7c41aa";
private static final String SECRET = "hunter2";`,
    checks:[
      { re:/String\s+\w*(KEY|SECRET|TOKEN|PASSWORD)\w*\s*=\s*"[^"]+"/i, bad:true, msg:'A secret is embedded in the APK. JADX will show it in plain text.' }
    ],
    fixNote:'Move the secret to your backend and give the app a short-lived, scoped token instead.' }
];

    $('#aOut').innerHTML = `<div class="feedback ${pct>=70?'ok':'no'}">
      <b>${right}/${total} correct (${pct}%)</b><br>
      ${pct>=70?'Solid — you know which technique finds which class of bug.':'Review: static analysis reads the APK without running it; dynamic analysis observes the app while it runs; some issues are best confirmed by both.'}
    </div>`;
    if(pct>=70) award(30,'Static vs Dynamic exercise');
  };
}

let tmMetric = 'difficulty';
function labTreemap(host){
  const metrics = {
    difficulty:{ label:'Difficulty', fn:t=>t.lvl*10 + 5 },
    time:{ label:'Learning time', fn:t=>t.mins },
    surface:{ label:'Attack surface', fn:t=>({low:6,medium:12,high:22}[t.surface]||10) },
    confidence:{ label:'Your confidence', fn:t=>S.completed[t.id] ? S.completed[t.id].score : 4 }
  };
  const m = metrics[tmMetric];

  // Build a two-level treemap: category blocks, then topics inside.
  const rects = [];
  const cats = CATKEYS.map(k=>({
    k, size: TOPICS.filter(t=>t.cat===k).reduce((s,t)=>s+m.fn(t),0),
    items: TOPICS.filter(t=>t.cat===k).map(t=>({ t, size:m.fn(t) }))
  }));
  layout(cats, 0, 0, 100, 100, rects, 0);

  const cells = [];
  rects.forEach(r=>{
    if(r.level===1){
      const c = CATS[r.catKey];
      cells.push(`<div class="tmcell" style="left:${r.x}%;top:${r.y}%;width:${r.w}%;height:${r.h}%;
        background:${c.color}22;color:${c.color};border-color:${c.color}55;pointer-events:none;padding:6px 8px">
        <span style="font-size:10.5px;letter-spacing:.08em">${c.name.toUpperCase()}</span></div>`);
    } else {
      const c = CATS[r.topic.cat], done = !!S.completed[r.topic.id];
      const bg = done ? c.color : (c.color + '99');
      cells.push(`<div class="tmcell" data-topic="${r.topic.id}" role="button" tabindex="0"
        style="left:${r.x}%;top:${r.y}%;width:${r.w}%;height:${r.h}%;background:${bg}">
        ${r.topic.title}<small>${done?'✓ mastered':(LEVELNAME[r.topic.lvl])}</small></div>`);
    }
  });

  host.innerHTML = `
    <p class="muted tiny">Each rectangle is a vulnerability. Size represents the selected metric. Click any cell to open its lesson.</p>
    <div class="row" style="margin-bottom:12px">
      ${Object.entries(metrics).map(([k,v])=>`<button class="chip ${tmMetric===k?'on':''}" data-metric="${k}">${v.label}</button>`).join('')}
    </div>
    <div class="tm">${cells.join('')}</div>`;

  $$('#view-lab [data-metric]').forEach(b=> b.onclick = ()=>{ tmMetric = b.dataset.metric; renderLab(); });
  $$('#view-lab .tmcell[data-topic]').forEach(el=>{
    el.onclick = ()=>openLesson(el.dataset.topic);
    el.onkeydown = e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openLesson(el.dataset.topic); } };
  });
}

function layout(items, x, y, w, h, out, level){
  if(!items.length) return;
  if(items.length===1){
    const it = items[0];
    if(level===0){
      out.push({level:1, catKey:it.k, x, y, w, h});
      layout(it.items, x, y, w, h, out, 1);
    } else {
      out.push({level:2, topic:it.t, x, y, w, h});
    }
    return;
  }
  const total = items.reduce((s,i)=>s+i.size,0);
  let acc=0, split=1;
  for(let i=0;i<items.length;i++){ acc += items[i].size; if(acc >= total/2){ split = i+1; break; } }
  const a = items.slice(0,split), b = items.slice(split);
  const aSize = a.reduce((s,i)=>s+i.size,0), frac = aSize/total;
  if(w >= h){
    layout(a, x, y, w*frac, h, out, level);
    layout(b, x + w*frac, y, w*(1-frac), h, out, level);
  } else {
    layout(a, x, y, w, h*frac, out, level);
    layout(b, x, y + h*frac, w, h*(1-frac), out, level);
  }
}

    const pct = Math.round(score/max*100);
    const rank = pct>=92 ? 'MOBILE SECURITY EXPERT'
              : pct>=78 ? 'ANDROID SECURITY TESTER'
              : pct>=58 ? 'APP SECURITY EXPLORER'
              : pct>=35 ? 'NOVICE'
              : 'SCRIPT KIDDIE';
    host.innerHTML = `
      <h2>Security Audit Complete</h2>
      <div class="grid g3" style="margin:16px 0">
        <div class="card tight"><div class="statlab">Vulnerabilities found</div><div class="statbig">${B.found}<span class="muted" style="font-size:15px">/${BOSS.length}</span></div></div>
        <div class="card tight"><div class="statlab">Correct fixes</div><div class="statbig">${B.fixed}<span class="muted" style="font-size:15px">/${BOSS.length}</span></div></div>
        <div class="card tight"><div class="statlab">Audit score</div><div class="statbig">${pct}%</div></div>
      </div>
      <div class="card good" style="text-align:center;padding:30px">
        <div class="statlab">Final rank</div>
        <div style="font-size:clamp(22px,4vw,38px);font-weight:800;letter-spacing:-.03em;margin:6px 0 10px">${rank}</div>
        <p class="muted tiny" style="max-width:520px;margin:0 auto">
          ${pct>=78
            ? 'You can find, explain and fix real Android security issues. Next step: pick a real app of your own and audit it end to end.'
            : 'Solid start. Revisit the weak branches on the learning map and run the audit again — the same reasoning applies to every real app you will ever test.'}
        </p>
      </div>
      <div class="row" style="margin-top:18px">
        <button class="btn primary" id="bossAgain">↻ Run the audit again</button>
        <button class="btn" data-go="progress">View progress radar</button>
      </div>`;
    if(!S.boss || S.boss < pct){ S.boss = pct; save(); }
    if(pct >= 78) award(200, 'Final boss cleared');
    $('#bossAgain').onclick = ()=>{ B = {i:0, found:0, fixed:0, started:true}; paintBoss(); };
    return;
  }

  const clue = BOSS[B.i];
  host.innerHTML = `
    <div class="row" style="justify-content:space-between;margin-bottom:14px">
      <h2 style="margin:0">SecureBank Audit</h2>
      <span class="pill">Clue ${B.i+1} / ${BOSS.length}</span>
    </div>
    <div class="pbar"><i style="width:${B.i/BOSS.length*100}%"></i></div>

    <div class="card tech">
      <div class="kicker b">🔎 Evidence — ${clue.area}</div>
      <pre class="code">${hl(clue.clue)}</pre>
    </div>

    <div class="card">
      <div class="kicker w">Step 1 — Which vulnerability class is this?</div>
      <div id="bossOpts">
        ${clue.opts.map((o,i)=>{
          const t = BY_ID[o];
          return `<button class="qopt" data-b="${i}"><span class="k">${'ABCD'[i]}</span><span>${t.title}</span></button>`;
        }).join('')}
      </div>
      <div id="bossFb"></div>
    </div>`;

  $$('#bossOpts .qopt').forEach(b=>{
    b.onclick = ()=>{
      const picked = clue.opts[+b.dataset.b];
      const ok = picked === clue.ans;
      $$('#bossOpts .qopt').forEach(x=>x.disabled = true);
      b.classList.add(ok?'right':'wrong');
      if(ok) B.found++;
      $('#bossFb').innerHTML = ok
        ? `<div class="feedback ok"><b>✅ Correct — ${BY_ID[clue.ans].title}.</b> ${BY_ID[clue.ans].take}
             <div style="margin-top:12px" class="kicker g">Step 2 — Choose the fix</div>
             ${clue.fixes.map((f,i)=>`<button class="qopt" data-f="${i}"><span class="k">${'ABC'[i]}</span><span>${f.t}</span></button>`).join('')}
           </div>`
        : `<div class="feedback no"><b>❌ Not the right class.</b> This evidence points at <b>${BY_ID[clue.ans].title}</b>.
             <button class="btn sm" style="margin-top:10px" id="bossNext">Next clue →</button></div>`;
      if(!ok) $('#bossNext').onclick = ()=>{ B.i++; paintBoss(); };
      $$('#bossFb [data-f]').forEach(fb=>{
        fb.onclick = ()=>{
          const f = clue.fixes[+fb.dataset.f];
          $$('#bossFb [data-f]').forEach(x=>x.disabled=true);
          fb.classList.add(f.ok?'right':'wrong');
          $$('#bossFb [data-f]')[clue.fixes.findIndex(x=>x.ok)].classList.add('right');
          if(f.ok) B.fixed++;
          $('#bossFb').insertAdjacentHTML('beforeend',
            `<div class="feedback ${f.ok?'ok':'no'}">${f.ok?'<b>✅ Correct fix.</b>':'<b>❌ That is not the correct fix.</b>'}
              <button class="btn sm" style="margin-top:10px" id="bossNext2">Next clue →</button></div>`);
          $('#bossNext2').onclick = ()=>{ B.i++; paintBoss(); };
        };
      });
    };
  });
}

/* =====================================================================
   KEYBOARD SHORTCUTS + INIT
   ===================================================================== */
document.addEventListener('keydown', e=>{
  if(e.target.matches('input,textarea')) return;
  const map = {'1':'home','2':'map','3':'lab','4':'progress','5':'boss'};
  if(map[e.key]) go(map[e.key]);
  if(e.key === '/' ){ e.preventDefault(); go('lab'); setTimeout(()=>$('#tIn')?.focus(),150); }
});

if(S.nomotion) document.body.classList.add('nomotion');
refreshXP();
renderHome();
</script>
</body>
</html>
